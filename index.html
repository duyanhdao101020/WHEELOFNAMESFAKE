<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幸运转盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:wght@500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--deep:#7d0c1b;--gold:#f2c14e;--cream:#fff0cc;--ink:#3a0910;
--serif:"Noto Serif SC","Noto Serif","Songti SC",SimSun,serif;--brush:"Ma Shan Zheng","Kaiti SC",KaiTi,STKaiti,serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--serif);color:var(--cream);background-color:var(--deep);
background-image:radial-gradient(circle at 50% 100%,transparent 0 17px,rgba(242,193,78,.16) 18px 20px,transparent 21px),
radial-gradient(circle at 50% 100%,transparent 0 17px,rgba(242,193,78,.16) 18px 20px,transparent 21px),
radial-gradient(ellipse at 50% 0,#b3121f 0,transparent 70%);
background-size:44px 22px,44px 22px,100% 100%;background-position:0 0,22px 11px,0 0;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
header{text-align:center;padding:26px 16px 6px;position:relative}
h1{font:400 clamp(44px,9vw,84px)/1.05 var(--brush);margin:0;color:var(--gold);letter-spacing:.08em;text-shadow:0 3px 0 var(--deep),0 0 24px rgba(242,193,78,.35)}
header p{margin:6px 0 0;font-size:15px;opacity:.85}
.lantern{position:absolute;top:-6px;font-size:clamp(44px,8vw,76px);transform-origin:50% 0;animation:sway 4s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.lantern.l{left:3%}.lantern.r{right:3%;animation-delay:-2s}
@keyframes sway{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
main{display:flex;flex-wrap:wrap;gap:28px 40px;justify-content:center;align-items:flex-start;max-width:1100px;margin:0 auto;padding:18px 16px 48px}
.stage{position:relative;width:min(92vw,540px);aspect-ratio:1;flex:0 1 540px}
canvas#wheel{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45))}
#pointer{position:absolute;left:50%;top:-10px;width:44px;height:58px;transform:translateX(-50%);transform-origin:50% 20%;z-index:2;
background:linear-gradient(160deg,#ffe08a,#d9941a);clip-path:polygon(50% 100%,0 22%,18% 0,82% 0,100% 22%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.panel{flex:1 1 300px;max-width:440px;background:var(--cream);color:var(--ink);border:3px solid var(--gold);border-radius:6px;padding:18px;
box-shadow:0 0 0 6px var(--deep),0 0 0 8px var(--gold),0 18px 30px rgba(0,0,0,.4)}
.panel h2{margin:0 0 4px;font:400 30px var(--brush);color:var(--red)}
.panel .hint{margin:0 0 10px;font-size:14px;opacity:.75}
textarea{width:100%;height:260px;resize:vertical;border:2px solid #d9b25c;border-radius:4px;padding:10px 12px;font:600 17px/1.55 var(--serif);color:var(--ink);background:#fffaf0}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.count{font-size:14px;margin-right:auto}
button{font:700 15px var(--serif);border:2px solid var(--red);background:transparent;color:var(--red);padding:8px 14px;border-radius:4px;cursor:pointer}
button:hover{background:rgba(200,16,46,.09)}
button.go{width:100%;margin-top:14px;padding:14px;font:400 34px var(--brush);letter-spacing:.3em;text-indent:.3em;color:#fff3cf;border:2px solid var(--gold);
background:linear-gradient(#e0263f,#a30c20);box-shadow:0 4px 0 #6c0715}
button.go:hover{background:linear-gradient(#ea3550,#b30e25)}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #6c0715}
button:disabled{opacity:.55;cursor:not-allowed}
#mute{position:fixed;right:12px;bottom:12px;z-index:5;background:var(--gold);color:var(--ink);border-color:var(--deep);font-size:20px;padding:6px 12px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
.modal{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(40,0,6,.7);padding:16px}
.modal.on{display:flex}
.card{width:min(92vw,440px);text-align:center;background:var(--cream);color:var(--ink);border:4px solid var(--gold);border-radius:8px;padding:26px 20px 22px;
box-shadow:0 0 0 7px var(--red),0 0 0 9px var(--gold),0 24px 50px rgba(0,0,0,.6);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card .gx{font:400 52px var(--brush);color:var(--red)}
.card .who{font:700 clamp(30px,8vw,46px)/1.2 var(--serif);margin:8px 0 4px;overflow-wrap:anywhere;color:var(--deep)}
.card .row{justify-content:center;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:4px;font-weight:700;opacity:0;transition:opacity .25s;z-index:10;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.lantern,.card{animation:none}}
</style>
</head>
<body>
<header>
  <span class="lantern l" aria-hidden="true">🏮</span><span class="lantern r" aria-hidden="true">🏮</span>
  <h1>幸运转盘</h1>
  <p>每行一个名字，转出今日幸运儿</p>
</header>

<main>
  <section class="stage">
    <div id="pointer"></div>
    <canvas id="wheel" aria-label="幸运转盘"></canvas>
  </section>

  <section class="panel">
    <h2>名单</h2>
    <p class="hint">输入名字，按回车键换行。</p>
    <textarea id="names" spellcheck="false" placeholder="张伟&#10;李明&#10;王芳"></textarea>
    <div class="row">
      <span class="count" id="count"></span>
      <button id="shuffle" type="button">打乱</button>
      <button id="sort" type="button">排序</button>
      <button id="clear" type="button">清空</button>
    </div>
    <button class="go" id="spin" type="button">开 始</button>
  </section>
</main>

<button id="mute" type="button" title="开关声音" aria-label="开关声音">🔊</button>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="who">
  <div class="card">
    <div class="gx">恭喜发财！</div>
    <div>恭喜幸运儿</div>
    <div class="who" id="who"></div>
    <div class="row">
      <button id="again" type="button">再转一次</button>
      <button id="remove" type="button">移除此名</button>
      <button id="removeAll" type="button" hidden></button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), TAU=Math.PI*2;
const cv=$('wheel'), c=cv.getContext('2d'), ta=$('names');
const COLORS=[['#c8102e','#ffe9ad'],['#fff0cc','#7d0c1b'],['#7d0c1b','#ffe9ad'],['#f2c14e','#7d0c1b']];
let names=[], rot=0, spinning=false, winner=-1, muted=false;
const key=t=>t.toLowerCase();

/* ---------- lưu danh sách ---------- */
const KEY='wheel-names';
let saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
ta.value=saved!==null?saved:['张伟','李明','王芳','刘洋','陈静','杨帆'].join('\n');
function sync(){
  names=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  $('count').textContent=names.length+' 个名字';
  try{localStorage.setItem(KEY,ta.value)}catch(e){}
  draw();
}
ta.addEventListener('input',sync);
function setNames(a){ta.value=a.join('\n');sync()}

/* ---------- vẽ vòng quay ---------- */
function resize(){
  const d=Math.min(devicePixelRatio||1,2), w=cv.clientWidth;
  cv.width=cv.height=Math.round(w*d); draw();
}
function draw(){
  const s=cv.width, R=s/2, r=R*.925, n=names.length, d=s/540;
  c.clearRect(0,0,s,s); c.save(); c.translate(R,R);
  // vành vàng
  const g=c.createLinearGradient(-R,-R,R,R); g.addColorStop(0,'#ffe08a'); g.addColorStop(.5,'#d9941a'); g.addColorStop(1,'#ffe08a');
  c.beginPath(); c.arc(0,0,R*.99,0,TAU); c.fillStyle=g; c.fill();
  c.beginPath(); c.arc(0,0,R*.95,0,TAU); c.fillStyle='#7d0c1b'; c.fill();
  c.save(); c.rotate(rot);
  if(!n){
    c.beginPath(); c.arc(0,0,r,0,TAU); c.fillStyle='#fff0cc'; c.fill();
  }else{
    const seg=TAU/n;
    for(let i=0;i<n;i++){
      let k=i%4; if(i===n-1&&n%4===1)k=2;
      c.beginPath(); c.moveTo(0,0); c.arc(0,0,r,i*seg,(i+1)*seg); c.closePath();
      c.fillStyle=COLORS[k][0]; c.fill(); c.lineWidth=1.5*d; c.strokeStyle='rgba(242,193,78,.7)'; c.stroke();
      c.save(); c.rotate(i*seg+seg/2); c.textAlign='right'; c.textBaseline='middle'; c.fillStyle=COLORS[k][1];
      let fs=Math.max(11*d,Math.min(30*d,seg*r*.5)), t=names[i], maxW=r*.64;
      c.font='700 '+fs+'px "Noto Serif SC","Noto Serif",serif';
      while(c.measureText(t).width>maxW&&fs>10*d){fs-=1;c.font='700 '+fs+'px "Noto Serif SC","Noto Serif",serif'}
      while(c.measureText(t).width>maxW&&t.length>1)t=t.slice(0,-1);
      if(t!==names[i])t=t.slice(0,-1)+'…';
      c.fillText(t,r*.93,0); c.restore();
    }
  }
  c.restore();
  // đinh trang trí
  c.fillStyle='#fff0cc';
  for(let i=0;i<28;i++){const a=i*TAU/28;c.beginPath();c.arc(Math.cos(a)*R*.97,Math.sin(a)*R*.97,R*.011,0,TAU);c.fill()}
  // lõi 福
  const h=c.createRadialGradient(0,-R*.03,2,0,0,R*.15); h.addColorStop(0,'#fff0cc'); h.addColorStop(1,'#e0a62a');
  c.beginPath(); c.arc(0,0,R*.15,0,TAU); c.fillStyle=h; c.fill(); c.lineWidth=4*d; c.strokeStyle='#7d0c1b'; c.stroke();
  c.fillStyle='#c8102e'; c.font='400 '+R*.19+'px "Ma Shan Zheng","Kaiti SC",KaiTi,serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('福',0,R*.015);
  c.restore();
}
function idxAt(a){const n=names.length,seg=TAU/n,x=((1.5*Math.PI-a)%TAU+TAU)%TAU;return Math.floor(x/seg)%n}

/* ---------- âm thanh (WebAudio, không cần file) ---------- */
let ac,master,nb;
function audio(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.8; master.connect(ac.destination);
    nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume(); return ac;
}
function tone(f,t,d,type,v,f2){
  const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0005,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
}
function burst(t,d,type,f,q,v){
  const s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain(); s.buffer=nb; b.type=type; b.frequency.value=f; b.Q.value=q;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0005,t+d); s.connect(b); b.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+d+.02);
}
const sfx={
  tick(){ if(muted)return; const t=audio().currentTime; tone(1900+Math.random()*250,t,.045,'square',.04); tone(720,t,.05,'triangle',.14) },
  start(){ if(muted)return; const t=audio().currentTime; tone(210,t,.35,'sine',.7,60); burst(t,.3,'bandpass',500,1,.25);
           tone(210,t+.22,.3,'sine',.5,60) },
  win(){
    if(muted)return; const a=audio(),t=a.currentTime;
    [1,2.01,2.76,4.1,5.4].forEach((m,i)=>tone(170*m,t,3.4/(i*.6+1),'sine',.3/(i+1)));        // chiêng
    [523,659,784,1047,784,1047,1319].forEach((f,i)=>{tone(f,t+.15+i*.09,.5,'triangle',.18);tone(f*2,t+.15+i*.09,.3,'sine',.05)}); // ngũ cung
    for(let i=0;i<16;i++){const q=t+.1+i*.07+Math.random()*.05;burst(q,.05,'highpass',2200,.7,.45);tone(110,q,.08,'sine',.2)}   // pháo
    // đám đông hò reo
    const s=a.createBufferSource(),m=a.createGain(),T=t+.35; s.buffer=nb; s.loop=true;
    m.gain.setValueAtTime(0,T); m.gain.linearRampToValueAtTime(.6,T+.4); m.gain.setValueAtTime(.6,T+1.2); m.gain.exponentialRampToValueAtTime(.001,T+2.9);
    [[700,4,1],[1150,5,1],[2800,3,.35]].forEach(([f,q,v])=>{const b=a.createBiquadFilter(),g=a.createGain();b.type='bandpass';b.frequency.value=f;b.Q.value=q;g.gain.value=v;s.connect(b);b.connect(g);g.connect(m)});
    const l=a.createOscillator(),lg=a.createGain(); l.frequency.value=7; lg.gain.value=.18; l.connect(lg); lg.connect(m.gain); l.start(T); l.stop(T+3);
    m.connect(master); s.start(T); s.stop(T+3);
    for(let k=0;k<7;k++){ // tiếng "ồ-hô!"
      const st=T+Math.random()*.6,f0=260+Math.random()*260,o=a.createOscillator(),b=a.createBiquadFilter(),g=a.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(f0,st); o.frequency.exponentialRampToValueAtTime(f0*1.7,st+.35); o.frequency.exponentialRampToValueAtTime(f0*1.35,st+1);
      b.type='bandpass'; b.frequency.value=900; b.Q.value=3; g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(.09,st+.12); g.gain.exponentialRampToValueAtTime(.001,st+1);
      o.connect(b); b.connect(g); g.connect(master); o.start(st); o.stop(st+1.05);
    }
    setTimeout(()=>{try{const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)); if(v){const u=new SpeechSynthesisUtterance('恭喜发财！');u.voice=v;u.lang=v.lang;u.pitch=1.3;u.rate=.9;speechSynthesis.speak(u)}}catch(e){}},700);
  }
};

/* ---------- pháo giấy ---------- */
function confetti(){
  const k=$('fx'),x=k.getContext('2d'); k.width=innerWidth; k.height=innerHeight;
  const cols=['#f2c14e','#c8102e','#fff0cc','#ff6a3d'];
  const P=Array.from({length:170},()=>({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.55,vx:(Math.random()-.5)*17,vy:-Math.random()*17-5,
    w:6+Math.random()*6,h:10+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*4|0],coin:Math.random()<.25}));
  let f=0;
  (function a(){
    x.clearRect(0,0,k.width,k.height);
    for(const p of P){
      p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
      if(p.coin){x.fillStyle='#f2c14e';x.beginPath();x.arc(0,0,8,0,TAU);x.fill();x.fillStyle='#7d0c1b';x.fillRect(-2.5,-2.5,5,5)}
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      x.restore();
    }
    if(++f<280)requestAnimationFrame(a); else x.clearRect(0,0,k.width,k.height);
  })();
}

/* ---------- quay ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function flick(){$('pointer').animate([{transform:'translateX(-50%) rotate(-24deg)'},{transform:'translateX(-50%) rotate(0)'}],{duration:130})}
function spin(){
  if(spinning)return;
  if(names.length<2){toast('至少需要两个名字');return}
  audio(); spinning=true; $('spin').disabled=true; sfx.start();
  const start=rot, total=(6+Math.floor(Math.random()*3))*TAU+Math.random()*TAU, dur=6500+Math.random()*1500, t0=performance.now();
  let last=idxAt(rot);
  (function f(now){
    const t=Math.min(1,(now-t0)/dur); rot=start+total*(1-Math.pow(1-t,4));
    const i=idxAt(rot); if(i!==last){last=i;sfx.tick();flick()}
    draw();
    if(t<1)requestAnimationFrame(f); else done(i);
  })(t0);
}
function done(i){
  spinning=false; $('spin').disabled=false; winner=i;
  const dup=names.filter(n=>key(n)===key(names[i])).length;
  $('removeAll').hidden=dup<2; $('removeAll').textContent='移除全部同名（'+dup+'）';
  $('who').textContent=names[i]; $('modal').classList.add('on'); $('again').focus();
  sfx.win(); confetti();
}
function closeModal(){$('modal').classList.remove('on');try{speechSynthesis.cancel()}catch(e){}}

/* ---------- sự kiện ---------- */
$('spin').onclick=spin; cv.onclick=spin;
$('again').onclick=closeModal;
$('remove').onclick=()=>{ if(winner>=0){names.splice(winner,1);setNames(names);winner=-1} closeModal() };
$('removeAll').onclick=()=>{ if(winner>=0){const k=key(names[winner]);setNames(names.filter(n=>key(n)!==k));winner=-1} closeModal() };
$('shuffle').onclick=()=>{const a=names.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}setNames(a)};
$('sort').onclick=()=>setNames(names.slice().sort((a,b)=>a.localeCompare(b,'zh-CN')));
$('clear').onclick=()=>{setNames([]);ta.focus()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted)try{speechSynthesis.cancel()}catch(e){}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
addEventListener('resize',resize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
sync(); resize();
</script>
</body>
</html>
